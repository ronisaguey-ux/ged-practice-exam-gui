<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
<rect width="600" height="360" fill="#0f172a"/>
<text x="20" y="30" fill="#e2e8f0" font-family="sans-serif" font-size="16">Bean seedlings after four weeks</text>
<rect x="70" y="230" width="140" height="80" rx="8" fill="#334155"/>
<rect x="90" y="150" width="10" height="90" fill="#22c55e"/>
<rect x="120" y="110" width="10" height="130" fill="#22c55e"/>
<rect x="150" y="140" width="10" height="100" fill="#22c55e"/>
<text x="70" y="345" fill="#94a3b8" font-family="sans-serif" font-size="14">Group A: sunlight</text>
<text x="90" y="100" fill="#22c55e" font-family="sans-serif" font-size="13">avg 20 cm, 9 leaves</text>
<rect x="380" y="230" width="140" height="80" rx="8" fill="#334155"/>
<rect x="400" y="215" width="10" height="25" fill="#64748b"/>
<rect x="430" y="205" width="10" height="35" fill="#64748b"/>
<rect x="460" y="220" width="10" height="20" fill="#64748b"/>
<text x="380" y="345" fill="#94a3b8" font-family="sans-serif" font-size="14">Group B: no sunlight</text>
<text x="400" y="195" fill="#94a3b8" font-family="sans-serif" font-size="13">avg 8 cm, 3 leaves</text>
</svg>
